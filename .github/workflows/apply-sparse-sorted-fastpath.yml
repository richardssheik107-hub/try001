name: apply-sparse-sorted-fastpath

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch SparseSoftmax kernel in place
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('SparseSoftmax_problem_298_template/code/op_kernel/sparse_softmax.cpp')
          text = path.read_text()
          marker = '// Sorted broadcast-index linear run fast path.'
          if marker in text:
              raise SystemExit(0)

          start_key = '    __aicore__ inline void ProcessBroadcastIndexTile(\n'
          end_key = '    __aicore__ inline void ProcessFullIndexTile(\n'
          start = text.index(start_key)
          end = text.index(end_key, start)

          replacement = r'''    // Sorted broadcast-index linear run fast path.
    // For the common PyG layout where one 1-D index vector is broadcast over
    // inner lanes, monotonic labels imply that each group is one contiguous
    // run.  Discovering runs is O(dim) instead of repeated first-occurrence
    // and full-axis scans.  Unsorted/full-shape cases keep the original path.
    __aicore__ inline void ProcessBroadcastIndexTile(
        AscendC::LocalTensor<StorageType> raw,
        AscendC::LocalTensor<int32_t> cachedIndex,
        bool localIndex, uint64_t rowStride,
        uint64_t outer, uint64_t innerStart,
        uint64_t tileWidth) {
        if (localIndex && dimSize_ > 0U) {
            bool sortedRuns = true;
            int32_t previous = cachedIndex.GetValue(0);
            uint32_t runLength = 1U;
            for (uint64_t pos = 1U; pos < dimSize_; ++pos) {
                const int32_t current = cachedIndex.GetValue(
                    static_cast<uint32_t>(pos));
                if (current < previous) {
                    sortedRuns = false;
                    break;
                }
                if (current == previous) {
                    ++runLength;
                    if (runLength > WORK_ELEMS) {
                        sortedRuns = false;
                        break;
                    }
                } else {
                    previous = current;
                    runLength = 1U;
                }
            }

            if (sortedRuns) {
                uint64_t runStart = 0U;
                while (runStart < dimSize_) {
                    const int32_t group = cachedIndex.GetValue(
                        static_cast<uint32_t>(runStart));
                    uint64_t runEnd = runStart + 1U;
                    while (runEnd < dimSize_ &&
                           cachedIndex.GetValue(
                               static_cast<uint32_t>(runEnd)) == group) {
                        ++runEnd;
                    }

                    const uint32_t groupCount =
                        static_cast<uint32_t>(runEnd - runStart);
                    uint64_t laneStart = 0U;
                    while (laneStart < tileWidth) {
                        const uint32_t laneBatch = ChooseLaneBatch(
                            tileWidth - laneStart, groupCount);
                        SoftmaxContiguousBatch(
                            raw, rowStride, laneStart, laneBatch,
                            runStart, runEnd);
                        laneStart += laneBatch;
                    }
                    runStart = runEnd;
                }
                return;
            }
        }

        for (uint64_t seed = 0; seed < dimSize_; ++seed) {
            const int32_t group = IndexAtTile(
                cachedIndex, localIndex, true, 0,
                outer, seed, innerStart, 0);
            if (!IsFirstTileOccurrence(
                    cachedIndex, localIndex, true, 0,
                    outer, seed, innerStart, 0, group)) {
                continue;
            }

            uint64_t singletonPos = 0;
            const uint32_t groupCount = CountBroadcastGroup(
                cachedIndex, localIndex, outer,
                innerStart, group, singletonPos);

            uint64_t laneStart = 0;
            while (laneStart < tileWidth) {
                const uint32_t laneBatch = ChooseLaneBatch(
                    tileWidth - laneStart, groupCount);
                SoftmaxBroadcastGroupBatch(
                    raw, cachedIndex, localIndex,
                    rowStride, outer, innerStart,
                    laneStart, laneBatch, group,
                    groupCount, singletonPos);
                laneStart += laneBatch;
            }
        }
    }

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SparseSoftmax_problem_298_template/code/op_kernel/sparse_softmax.cpp
          git commit -m "Inline sorted broadcast-index fast path"
          git push origin HEAD:main
